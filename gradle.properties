pluginVersion=0.1.0

# The IDE the plugin is built against and run in (runIde).
# When localIdePath is an existing folder, that installed IDE is used and nothing is downloaded.
# Otherwise PyCharm platformVersion is downloaded.
localIdePath=C:/Program Files/JetBrains/PyCharm 2026.3
platformVersion=2026.3
sinceBuild=263

# The Cool Theme Kit (VS Code) checkout the icons are taken from (syncIcons). Its dist/ must be built (bun run build).
coolThemeKitDir=../cool-theme-kit

org.gradle.configuration-cache=true
org.gradle.caching=true
kotlin.stdlib.default.dependency=false

# The icon styles besides glass (VS Code iconStyle), copied by syncIcons into src/main/resources/coolicons-<style>
iconStyles=flat,glossy
