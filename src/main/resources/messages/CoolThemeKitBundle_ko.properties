settings.roleMarks.hint=<html>이름으로 프로젝트에서의 역할을 알 수 있는 파일에, 언어 아이콘의 모서리에 표시를 붙입니다: 프로그램이 시작되는 곳(main.py, Program.cs), 패키지(__init__.py, mod.rs), 테스트(conftest.py), 설정(settings.py, config.ts).<br>끄면 이 파일들도 언어 아이콘만 받습니다. VS Code 용 Cool Theme Kit 의 roleMarks 와 같은 설정입니다.</html>
