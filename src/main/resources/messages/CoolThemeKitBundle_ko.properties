settings.iconStyle.glossy=광택
settings.iconStyle.flat=평면
settings.iconStyle.hint=<html>유리: 모든 파일 아이콘을 같은 둥근 타일 위의 글리프로, 모든 폴더를 같은 둥근 폴더로 그립니다.<br>광택: 평면처럼 아이콘마다 제 모양과 색 그대로, 타일 없이 유리 스타일의 음영(그라데이션과 위쪽 가장자리 하이라이트)만 입힙니다.<br>평면: JetBrains 아이콘 플러그인이 그리는 그대로의 아이콘(로고마다 모양과 크기가 다름). VS Code 용 Cool Theme Kit 의 iconStyle 과 같은 설정입니다.</html>
settings.associations.title=아이콘 연결
settings.associations.hint=<html>이름에 아이콘을 직접 지정합니다. VS Code 용 Cool Theme Kit 의 filesAssociations, foldersAssociations, languagesAssociations 와 같습니다(같은 항목을 그대로 넣으면 됩니다).<br>아이콘은 Cool Icons 아이콘 이름(rust, docker, 폴더는 tests, docs) 또는 SVG 파일 경로(C:/icons/foo.svg, ~/icons/foo.svg)입니다.</html>
