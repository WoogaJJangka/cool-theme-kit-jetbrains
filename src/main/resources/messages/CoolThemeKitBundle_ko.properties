settings.accent.hint=<html>Islands Dark·Islands Light 의 파랑을 바꿉니다: 포커스 테두리, 버튼, 진행 막대, 링크, 선택된 탭, 선택 영역(편집기 포함). git·터미널·디버거 색은 건드리지 않습니다. VS Code 용 Cool Theme Kit 의 accentColor·accentTargets 와 같은 설정이고 같은 색이 나옵니다.<br>폴더 아이콘·스크롤바·배지·편집기는 바로 바뀌고, 테마의 다른 색은 IDE 를 다시 시작하면 바뀝니다.</html>
notification.accent.restart.title=Cool Theme Kit
notification.accent.restart.content=새 강조색이 폴더 아이콘·스크롤바·편집기에 들어갔습니다. Islands 의 다른 색은 IDE 를 다시 시작하면 보입니다.
