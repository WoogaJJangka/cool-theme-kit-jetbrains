settings.accent.target.tabs=Tab lines
settings.accent.target.folders=Folder icons
settings.accent.hint=<html>Replaces the blue of Islands Dark and Islands Light: focus ring, buttons, progress bar, links, the selected tab and the selection, in the editor too. The colors of git, the terminal and the debugger are not touched. The same settings as accentColor and accentTargets of Cool Theme Kit for VS Code, with the same colors.<br>The folder icons, the scrollbars, the badges and the editor change at once; the other colors of the theme after a restart.</html>
notification.accent.restart.title=Cool Theme Kit
notification.accent.restart.content=The new accent is in the folder icons, the scrollbars and the editor. The other colors of Islands are seen after a restart of the IDE.
notification.accent.restart.action=Restart
settings.iconStyle=Icon style:
settings.iconStyle.glass=Glass
settings.iconStyle.glossy=Glossy
settings.iconStyle.flat=Flat
settings.iconStyle.hint=<html>Glass: every file icon is a glyph on the same rounded tile, every folder the same rounded folder.<br>Glossy: the icons in their own shape and colors, as in flat, with the shading of the glass style over them, without a tile.<br>Flat: the icons as the JetBrains icon plugin draws them, each logo with its own shape and size. iconStyle of Cool Theme Kit for VS Code.</html>
settings.associations.title=Associations
settings.associations.hint=<html>Give your own icon to names, as filesAssociations, foldersAssociations and languagesAssociations of Cool Theme Kit for VS Code (paste the same entries).<br>The icon is the name of a Cool Icons icon (rust, docker; for a folder: tests, docs) or the path of an SVG file (C:/icons/foo.svg, ~/icons/foo.svg).</html>
settings.associations.files=Files:
