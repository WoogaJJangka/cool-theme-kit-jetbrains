settings.associations.languages=Languages:
settings.associations.files.name=File name or *.extension
settings.associations.folders.name=Folder name
settings.associations.languages.name=Language id
settings.associations.icon=Icon
settings.associations.empty=No associations
settings.colors.title=Icon colors
settings.folderColor=Folder color:
settings.folderColor.hint=<html>The color of the folder icons (folderColor of Cool Theme Kit for VS Code). The accent replaces it when its targets include the folder icons.</html>
settings.monochrome=Display the icons in a single color:
settings.opacity=Opacity (%):
settings.saturation=Saturation (%):
settings.colors.hint=<html>monochrome, monochromeColor, opacity and saturation of Cool Theme Kit for VS Code: every file and folder icon is drawn again with them.</html>
settings.iconThemeLayers=Fill the names Cool Icons has no icon for with Material Icon Theme
settings.iconThemeLayers.hint=<html>As iconThemeLayers of Cool Theme Kit for VS Code (material-icon-theme by default): about 5,500 names, such as .resx or a folder named cargo, get the icon of Material Icon Theme. Off: the default file and folder icons.</html>
