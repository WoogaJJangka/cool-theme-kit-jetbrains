settings.title=Cool Theme Kit
settings.roleMarks=Role marks
settings.roleMarks.hint=<html>Mark the files whose name says what they are in the project, over the corner of the icon of their language: where the program starts (main.py, Program.cs), a package (__init__.py, mod.rs), tests (conftest.py), settings (settings.py, config.ts).<br>Off: these files get the icon of their language alone. The same setting as roleMarks of Cool Theme Kit for VS Code.</html>
